<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Session Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f0f0f0">

<style>
:root {
  /* Flashcard-reviewer feel: centered toolbar of text links, a plain centered "card" (Arial 20px, centered) split by a rule into front/back, and a bottom answer bar of small rounded buttons with a caption above each. Follows system light/dark. */
  --bg: #ffffff;
  --chrome: #f0f0f0;
  --line: #d4d4d4;
  --ink: #1f1f1f;
  --muted: #6b6b6b;
  --btn: #fcfcfc;
  --btn-line: #c4c4c4;
  --hover: #e7eef9;
  --blue: #1f6fd1;      /* "new" count */
  --red: #c4302b;       /* "learn" count */
  --green: #2e8b3e;     /* "due" count */
  --card-font: Arial, Helvetica, sans-serif;
  --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2c2c2c; --chrome: #232323; --line: #444; --ink: #e6e6e6; --muted: #a3a3a3;
    --btn: #3a3a3a; --btn-line: #555; --hover: #36414f; --blue: #6aa4f0; --red: #ef7a74; --green: #6cc480; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2c2c2c; --chrome: #232323; --line: #444; --ink: #e6e6e6; --muted: #a3a3a3;
  --btn: #3a3a3a; --btn-line: #555; --hover: #36414f; --blue: #6aa4f0; --red: #ef7a74; --green: #6cc480; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui-font); font-size: 16px; line-height: 1.45; overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.new { color: var(--blue); } .learn { color: var(--red); } .due { color: var(--green); }
#fsBtn { display: none !important; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }

/* Top toolbar */
.toolbar { background: var(--chrome); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 12px; }
.tb-links { display: flex; gap: 2px; justify-content: center; flex-wrap: wrap; }
.tb-link { background: none; border: 0; border-radius: 6px; padding: 6px 12px; font-size: 15px; color: var(--ink); }
.tb-link:hover { background: var(--hover); }
.tb-link.on { font-weight: 600; }
.sync { justify-self: end; font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--green); } .dot.busy { background: var(--blue); } .dot.err { background: var(--red); }

.stage { overflow-y: auto; padding: 0 16px 24px; }
.page { max-width: 640px; margin: 0 auto; padding-top: 22px; display: grid; gap: 14px; }
.page.narrow { max-width: 520px; }
.page.center { min-height: 100%; align-content: center; text-align: center; justify-items: center; }
.center-text { text-align: center; }
.title { font-family: var(--ui-font); font-size: 28px; font-weight: 600; margin: 0; }
.section { font-size: 18px; font-weight: 600; margin: 10px 0 0; text-align: center; }
p { margin: 0; }
ol, ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }

.input { background: var(--bg); border: 1px solid var(--btn-line); border-radius: 5px; padding: 6px 10px; font-size: 16px; }
.input.sm { width: 90px; padding: 4px 8px; }
.daterow { display: flex; justify-content: center; gap: 10px; align-items: center; }
.linkbtn { background: none; border: 0; color: var(--blue); padding: 4px; }

/* Deck list */
table.decks, table.browse { width: 100%; border-collapse: collapse; }
table.decks th { font-weight: 600; font-size: 14px; text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
table.decks td { padding: 9px 10px; }
table.decks tr[data-open], table.decks tr[data-go], table.decks tr[id] { cursor: pointer; }
table.decks tbody tr:hover { background: var(--hover); }
table.decks tr.current { background: color-mix(in srgb, var(--blue) 10%, transparent); }
.deckname { font-size: 17px; }
.arrow { color: var(--muted); margin-right: 6px; }
th.n, td.n { text-align: right; width: 64px; }
table.browse th { font-weight: 600; font-size: 13px; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--chrome); }
table.browse td { padding: 8px; border-bottom: 1px solid var(--line); font-size: 15px; }
table.browse tr[data-jump] { cursor: pointer; } table.browse tbody tr:hover { background: var(--hover); }
table.browse tr.current { background: color-mix(in srgb, var(--blue) 10%, transparent); }

/* Deck overview */
.ovcounts { margin: 4px auto; border-collapse: collapse; font-size: 17px; }
.ovcounts td { padding: 2px 8px; text-align: left; } .ovcounts td:last-child { text-align: right; font-weight: 600; }
.warm { text-align: left; width: 100%; border-top: 1px solid var(--line); padding-top: 10px; }
.warm summary { cursor: pointer; color: var(--muted); font-size: 15px; text-align: center; }
.warmitem { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 15px; }

/* Buttons (answer-bar style) */
.abtn { background: var(--btn); border: 1px solid var(--btn-line); border-radius: 5px; padding: 8px 18px; font-size: 15px; min-width: 84px; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
.abtn:hover { background: var(--hover); }
.abtn.primary { border-color: var(--blue); }
.abtn.danger { border-color: var(--red); color: var(--red); }
.abtn.wide { width: 100%; max-width: 320px; padding: 11px 18px; font-size: 16px; }

/* Reviewer card */
.revcounts { text-align: center; font-size: 15px; padding: 10px 0 0; font-weight: 600; }
.revcounts .plus { color: var(--muted); font-weight: 400; }
.card { max-width: 700px; margin: 0 auto; padding: 18px 8px 0; font-family: var(--card-font); font-size: 20px; text-align: center; }
.deckpath { font-family: var(--ui-font); margin-bottom: 14px; }
.q { font-size: 34px; line-height: 1.2; }
.q2 { font-size: 26px; margin: 4px 0; }
.qsub { margin-top: 8px; color: var(--muted); }
hr#answer { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
.back { display: grid; gap: 14px; justify-items: center; }
.rec { font-size: 16px; color: var(--muted); }
.rec.up { color: var(--green); } .rec.down { color: var(--red); }
.cue { font-size: 18px; line-height: 1.5; max-width: 56ch; }
.entry { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
.ent { display: grid; gap: 6px; justify-items: center; }
.lbl { font-family: var(--ui-font); font-size: 13px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 46px; height: 46px; border-radius: 5px; border: 1px solid var(--btn-line); background: var(--btn); font-size: 22px; line-height: 1; }
.stepper button:active { background: var(--hover); }
.typeans { width: 120px; height: 52px; text-align: center; font-family: var(--card-font); font-size: 28px; border: 1px solid var(--btn-line); border-radius: 5px; background: var(--bg); }
.clock { font-size: clamp(96px, 20vw, 170px); line-height: 1; margin: 6px 0 14px; }
.restbar { height: 4px; background: var(--line); border-radius: 4px; max-width: 420px; margin: 0 auto; overflow: hidden; }
.restbar > i { display: block; height: 100%; width: 0; background: var(--blue); }

/* Bottom answer bar */
.bottom { background: var(--chrome); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10px; padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); }
.bb-mid { display: flex; gap: 8px; justify-content: center; }
.bb-side.right { justify-self: end; }
.ab { display: grid; justify-items: center; gap: 3px; }
.ivl { font-size: 12px; color: var(--muted); min-height: 15px; }

/* Stats */
.lifts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.lift { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; }
.lift svg { width: 100%; height: 56px; }
.weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.wk { display: grid; gap: 4px; }
.wk .p { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
.pip { border: 1px solid var(--btn-line); border-radius: 4px; font-size: 11px; padding: 2px 0; background: var(--btn); color: var(--muted); }
.pip.done { background: var(--green); border-color: var(--green); color: #fff; }
.pip.part { border-color: var(--blue); color: var(--blue); }

@media (max-width: 600px) {
  .q { font-size: 28px; } .typeans { width: 96px; }
  .abtn { min-width: 0; padding: 8px 12px; }
  .bottom { grid-template-columns: auto 1fr auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="toolbar">
    <div></div>
    <nav class="tb-links" aria-label="Main">
      <button class="tb-link on" data-nav="workouts">Workouts</button>
      <button class="tb-link" data-nav="history">History</button>
      <button class="tb-link" data-nav="body">Bodyweight</button>
      <button class="tb-link" data-nav="rules">Rules</button>
      <button class="tb-link" data-nav="more">More</button>
    </nav>
    <span class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Connecting…</span><span id="fsBtn"></span></span>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="bottom" id="bottom" hidden></footer>
</div>
<script>
(() => {
"use strict";
/* ===================== PROGRAM ===================== */
// [code, name, baseSets, low, high, side, role, restSec, cue]
const DAYS = {
  ua: { name: "Upper A", focus: "Chest & back", lower: false, ex: [
    ["A1","Incline DB press",3,6,10,"","first",90,"Bench 30–45°. Elbows ~45° from torso, deep stretch at the bottom, control the lowering."],
    ["A2","Lat pulldown – heavy",3,6,8,"","",120,"Medium overhand grip. Chest up, drive elbows down and in, full stretch at the top."],
    ["B1","Seated cable fly",3,10,12,"","",60,"Bring the elbows together, not just the hands. Keep elbows high."],
    ["B2","Seated row machine – heavy",3,8,10,"","",90,"Let the shoulder blades stretch forward, then pull to the lower ribs."],
    ["C1","Cable lateral raise",3,8,10,"arm","plus",45,"Pulley at hip height. Sweep out, not up. No shrugging."],
    ["C2","Bayesian cable curl",3,10,12,"arm","plus",60,"Face away from the cable, arm behind you for a deep biceps stretch."],
    ["D1","Overhead cable triceps extension",3,10,12,"","",60,"Rope, cable high. Deep stretch behind the head."],
    ["D2","DB preacher curl",2,8,12,"arm","",60,"Arm over the incline bench back. Full stretch; last set to failure + lengthened partials."]
  ]},
  la: { name: "Lower A", focus: "Quads & hamstrings", lower: true, ex: [
    ["A","Leg curl machine – heavy",2,6,8,"","",90,"Done first so hamstrings are fresh. Slow lowering, full stretch."],
    ["B1","Heel-elevated DB goblet squat",3,8,12,"","first",90,"Heels on a plate. Upright torso, knees forward, full depth. Two DBs at the shoulders once one is too light."],
    ["B2","Single-leg DB calf raise",3,8,12,"leg","",60,"On a step. Pause 1–2 s in the deep stretch. No bouncing."],
    ["C1","DB Romanian deadlift",3,8,10,"","",90,"Hips back, DBs close to legs. Stop when hamstrings max out, not your lower back."],
    ["C2","Kneeling cable crunch",3,10,12,"","",60,"Curl ribs toward pelvis. Don't just hinge at the hips."],
    ["D1","Cable leg extension",2,10,15,"leg","",30,"Ankle strap, sit on the bench. Lean back slightly, squeeze at the top. Last set to failure."],
    ["D2","Cable hip adduction",2,10,12,"leg","",45,"Ankle strap, standing. Start from a wide stretch, sweep across the body."]
  ]},
  ub: { name: "Upper B", focus: "Shoulders, back width & arms", lower: false, ex: [
    ["A1","Seated DB shoulder press",3,8,10,"","first",90,"Bench nearly upright. Lower to about ear level, press slightly in."],
    ["A2","Lat pulldown – 2 grips",3,10,12,"","",120,"Sets 1–2 medium overhand, set 3 close underhand. Elbows to hips."],
    ["B1","Chest press machine",3,8,10,"","",60,"Handles at mid-chest. Full stretch, no bouncing."],
    ["B2","Seated row machine – wide",3,10,12,"","",90,"Wide grip, elbows flared, pull to the upper chest."],
    ["C1","Cable Y-raise",3,12,15,"","plus",45,"Both arms, low pulleys crossed. Last set: drop ~30% and continue to failure."],
    ["C2","Cable reverse fly",3,12,15,"","plus",60,"High pulleys crossed. Arms wide; think push out, not pull back."],
    ["D1","DB skull crusher",3,10,15,"","",45,"Lying on the bench. DBs beside the head, slight elbow drift back for the stretch."],
    ["D2","Incline DB curl",2,10,15,"","",60,"Arms hang behind the body. Last set to failure + lengthened partials."]
  ]},
  lb: { name: "Lower B", focus: "Glutes & hamstrings", lower: true, ex: [
    ["A1","DB Bulgarian split squat",3,8,10,"leg","first",60,"Long stride, slight forward lean for glutes. Control the bottom. Straps if grip fails."],
    ["A2","Seated DB calf raise",3,12,15,"","",90,"DB on the knees, balls of feet on a plate. Pause in the stretch."],
    ["B1","Leg curl machine",3,10,12,"","plus",60,"Lean forward if seated. Last set: drop set."],
    ["B2","DB hip thrust",2,10,15,"","",90,"Upper back on the bench, chin tucked, ribs down. 1 s squeeze at lockout."],
    ["C1","Cable pull-through",2,12,15,"","",45,"Rope, low pulley. Hips back, then drive them through."],
    ["C2","Lying leg raise",3,10,15,"","",60,"On the bench. Curl the pelvis up at the top; lower back stays down."],
    ["D1","Cable leg extension",2,12,15,"leg","",30,"Lighter and higher-rep than Lower A. Last set: drop set."],
    ["D2","Cable hip abduction",2,12,15,"leg","",45,"Ankle strap, standing. Lean forward slightly for upper glute."]
  ]}
};
const ORDER = ["ua","la","ub","lb"];
const WEEKDAY_SPLIT = { 1: "ua", 2: "la", 4: "ub", 5: "lb" }; // Mon, Tue, Thu, Fri
const DELOADS = [12,24,36,52];
const blockOf = w => w <= 12 ? 1 : w <= 24 ? 2 : w <= 36 ? 3 : 4;
const isDeload = w => DELOADS.includes(w);
function setsFor(w, base, role) {
  const b = blockOf(w); let s = base;
  if ((b === 2 || b === 4) && role === "plus") s += 1;
  if (b === 3 && role === "first") s = 4;
  if (isDeload(w)) s = Math.ceil(s / 2);
  return s;
}
function blockNote(w) {
  if (isDeload(w)) return "<b>Deload week.</b> Half the sets, about 70% of your usual weights, stop 3–4 reps short of failure.";
  if (w === 48) return "<b>Test week.</b> On the first lift, take one set to a true rep max.";
  const b = blockOf(w);
  if (b === 1) return w <= 2 ? "<b>Weeks 1–2.</b> Leave 2–3 reps in reserve while you find your working weights."
    : "<b>Block 1.</b> Compounds: 1–2 reps in reserve. Isolations: last set to failure.";
  if (b === 2) return "<b>Block 2.</b> Extra set on marked moves. After failure on an isolation's last set, add 4–6 lengthened partials.";
  if (b === 3) return "<b>Block 3.</b> First lift: 4 heavy sets at the low end of its rep range.";
  return "<b>Block 4.</b> Last set of every isolation: failure + partials or a drop set.";
}
const sid = (w, d) => `w${String(w).padStart(2,"0")}-${d}`;
function dayExercises(w, d) {
  return DAYS[d].ex.map(([code,name,base,lo,hi,side,role,rest,cue]) => ({ code, name, sets: setsFor(w, base, role), lo, hi, side, role, rest, cue }));
}
function groupsOf(exs) { const g = []; for (const e of exs) { const k = e.code[0]; let x = g.find(y => y.key === k); if (!x) g.push(x = { key: k, ex: [] }); x.ex.push(e); } return g; }

/* ===================== DATES ===================== */
const pad = x => String(x).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayISO = () => iso(new Date());
function mondayOf(d) { const x = new Date(d); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); return x; }
function nextMonday() { const t = new Date(); const k = (t.getDay() + 6) % 7; const x = new Date(t); x.setDate(t.getDate() + (k === 0 ? 0 : 7 - k)); return x; }
function niceDate(s) { return parse(s).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }); }
function planFor(dateStr) {
  const start = mondayOf(parse(settings.startDate));
  const diff = Math.round((mondayOf(parse(dateStr)) - start) / 86400000);
  const week = Math.floor(diff / 7) + 1;
  const dow = parse(dateStr).getDay();
  return { week, day: WEEKDAY_SPLIT[dow] || null, dow };
}

/* ===================== STATE & STORAGE ===================== */
const sessions = new Map(), bodyweight = new Map();
let settings = { startDate: "" };
let db = null, downloads = null, mode = "connecting", loaded = false;
const nav = { screen: "loading", stack: [] };
const run = { week: 0, day: "", date: "", s: null, order: [], cur: 0, restEnd: 0, restTotal: 0, tick: null };

function setSync(state, text) { document.getElementById("syncDot").className = "dot " + (state || ""); document.getElementById("syncText").textContent = text; }
const LS_KEY = "session-coach-v1";
function lsLoad() { try { const j = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); for (const [k,v] of Object.entries(j.s||{})) sessions.set(k,v); for (const [k,v] of Object.entries(j.b||{})) bodyweight.set(k,v); if (j.settings) settings = j.settings; } catch (e) {} }
function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify({ s: Object.fromEntries(sessions), b: Object.fromEntries(bodyweight), settings })); } catch (e) {} }

const pending = new Map(), inflight = new Set(), wtimers = new Map();
function queueWrite(path, body) {
  if (mode !== "db") { lsSave(); return; }
  pending.set(path, body); setSync("busy", "Saving…");
  clearTimeout(wtimers.get(path)); wtimers.set(path, setTimeout(() => flush(path), 600));
}
async function flush(path) {
  if (inflight.has(path)) { wtimers.set(path, setTimeout(() => flush(path), 400)); return; }
  const body = pending.get(path); if (!body) return;
  pending.delete(path); inflight.add(path);
  try { await db.doc(path).set(JSON.parse(JSON.stringify(body))); if (!pending.size && inflight.size === 1) setSync("ok", "Saved"); }
  catch (e) {
    if (e && e.code === "unavailable") { if (!pending.has(path)) pending.set(path, body); setTimeout(() => flush(path), 1500 + Math.random()*1000); }
    else setSync("err", "Not saved: " + (e && e.code || "error"));
  } finally { inflight.delete(path); }
}
function saveRun() {
  const s = run.s; s.updatedAt = new Date().toISOString(); if (!s.date) s.date = run.date;
  sessions.set(sid(run.week, run.day), JSON.parse(JSON.stringify(s)));
  queueWrite("sessions/" + sid(run.week, run.day), s);
}
function saveSettings() { queueWrite("meta/settings", settings); if (mode !== "db") lsSave(); }

function loadSession(w, d) {
  const prev = sessions.get(sid(w, d));
  const s = prev ? JSON.parse(JSON.stringify(prev)) : { week: w, day: d, date: "", done: false, ex: {} };
  for (const e of dayExercises(w, d)) {
    const cur = s.ex[e.code] || { sets: [], notes: "" };
    while (cur.sets.length < e.sets) cur.sets.push({ lb: "", reps: "", done: false });
    s.ex[e.code] = cur;
  }
  return s;
}

/* ===================== LOGIC ===================== */
const n = v => (v === "" || v == null || isNaN(+v)) ? null : +v;
const anyLogged = s => Object.values(s.ex || {}).some(x => (x.sets||[]).some(t => n(t.reps) != null));
function e1rm(sets) { let m = 0; for (const t of sets || []) { const lb = n(t.lb), r = n(t.reps); if (lb != null && r != null && r > 0) m = Math.max(m, lb * (1 + r/30)); } return m ? Math.round(m) : null; }
function previous(w, d, code) {
  for (let k = w - 1; k >= 1; k--) {
    const s = sessions.get(sid(k, d)); if (!s || isDeload(k)) continue;
    const x = s.ex && s.ex[code]; if (x && (x.sets||[]).some(t => n(t.reps) != null)) return { week: k, sets: x.sets.filter(t => n(t.reps) != null) };
  }
  return null;
}
function advice(prev, e, lower, w) {
  if (isDeload(w)) return { cls: "same", text: "Deload: about 70% of usual weight, easy reps" };
  if (!prev) return { cls: "same", text: `First time: choose a weight you can lift for ${e.lo} clean reps` };
  const reps = prev.sets.map(t => n(t.reps)), top = Math.max(...prev.sets.map(t => n(t.lb) || 0));
  if (reps.every(r => r >= e.hi)) return { cls: "up", text: `▲ Add weight: try ${top + (lower ? 10 : 5)} lb` };
  if (reps.some(r => r < e.lo)) return { cls: "down", text: `▼ Last time was too heavy: try ${Math.round(top * 0.95 / 2.5) * 2.5} lb` };
  return { cls: "same", text: `Same weight (${top} lb), beat last time's reps` };
}
function buildOrder(w, d, s) {
  const out = [];
  for (const g of groupsOf(dayExercises(w, d))) {
    const max = Math.max(...g.ex.map(e => s.ex[e.code].sets.length));
    for (let i = 0; i < max; i++) for (const e of g.ex) if (i < s.ex[e.code].sets.length) out.push({ e, i });
  }

async function saveFile(name, data, mime) {
  if (downloads) return downloads.save({ filename: name, data });
  try {
    const file = new File([data], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPad|iPhone|Macintosh/.test(navigator.userAgent) && "ontouchend" in document) {
      await navigator.share({ files: [file], title: name }); return { status: "saved" };
    }
  } catch (e) { if (e && e.name === "AbortError") { const err = new Error("declined"); err.code = "declined"; throw err; } }
  const url = URL.createObjectURL(new Blob([data], { type: mime }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return Promise.resolve({ status: "saved" });
}

  throw new Error("load");
}

render();
(async function boot() {
  const fallback = setTimeout(() => { if (!loaded) { loaded = true; mode = "local"; lsLoad(); setSync(STANDALONE ? "ok" : "err", STANDALONE ? "Saved on this iPad" : "Saving on this device only"); enterApp(); } }, 10000);
  try {
    const waitTries = (location.protocol === "file:" || STANDALONE) ? 0 : 50;
    for (let i = 0; i < waitTries && !(window.claude && typeof window.claude.use === "function"); i++) await new Promise(r => setTimeout(r, 100));
    if (window.claude && typeof window.claude.use === "function") [db, downloads] = await Promise.all([window.claude.use("db"), window.claude.use("downloads")]);
  } catch (e) { db = null; }
  if (!db) { if (!loaded) { loaded = true; clearTimeout(fallback); mode = "local"; lsLoad(); setSync(STANDALONE ? "ok" : "err", STANDALONE ? "Saved on this device" : "Saving on this device only"); enterApp(); } return; }
  mode = "db";
  let gS = false, gB = false, gM = false;
  const ready = () => { if (gS && gB && gM && !loaded) { loaded = true; clearTimeout(fallback); setSync("ok", "Synced"); enterApp(); } };
  db.collection("sessions").onSnapshot(snap => {
    for (const ch of snap.docChanges()) { if (ch.type === "removed") sessions.delete(ch.doc.id); else sessions.set(ch.doc.id, ch.doc.data()); }
    if (!snap.metadata.fromCache) { gS = true; ready(); }
  }, err => setSync("err", "Sync error: " + (err && err.code)));
  db.collection("bodyweight").onSnapshot(snap => {
    for (const ch of snap.docChanges()) { if (ch.type === "removed") bodyweight.delete(ch.doc.id); else bodyweight.set(ch.doc.id, ch.doc.data()); }
    if (!snap.metadata.fromCache) { gB = true; ready(); }
  }, err => setSync("err", "Sync error: " + (err && err.code)));
  db.doc("meta/settings").onSnapshot(snap => {
    if (snap.exists) { const d = snap.data(); if (d && d.startDate) settings = { ...settings, ...d }; }
    if (!snap.metadata.fromCache) { gM = true; ready(); }
  }, err => setSync("err", "Sync error: " + (err && err.code)));
})();
})();
</script>
